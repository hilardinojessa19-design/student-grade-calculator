<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 Student Grade Calculator</h1>
        <p>Enter your grades and calculate your average.</p>

        <input type="text" id="studentName" placeholder="Student Name">

        <input type="text" id="subject" placeholder="Subject">

        <input type="number" id="prelim" placeholder="Prelim Grade" min="0" max="100">

        <input type="number" id="midterm" placeholder="Midterm Grade" min="0" max="100">

        <input type="number" id="final" placeholder="Final Grade" min="0" max="100">

        <button onclick="calculateGrade()">Calculate Grade</button>

        <button onclick="clearForm()">Clear</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
